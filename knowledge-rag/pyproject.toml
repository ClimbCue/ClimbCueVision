[project]
name = "climbcue-rag"
version = "0.5.0"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.9,<3"]

[project.scripts]
climbcue-rag = "climbcue_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climbcue_rag"]
